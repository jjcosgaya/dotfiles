#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 0; # The blur radius for shadows, in pixels.

shadow-opacity = .3;

shadow-offset-x = 0;
shadow-offset-y = 0;

# shadow-color = "#000000"

# Crop shadow of a window fully on a particular monitor to that monitor. This is
# currently implemented using the X RandR extension.
# crop-shadow-to-monitor = false

# shadow-exclude = [
#   "name = 'Notification'",
#   "class_g = 'Conky'",
#   "class_g ?= 'Notify-osd'",
#   "class_g = 'Cairo-clock'",
#   "class_g = 'dwm'",
#   "class_g = 'chromium'",
#   "class_g *?= 'slop'",
#   "_GTK_FRAME_EXTENTS@:c"
# ];


#################################
#           Fading              #
#################################

fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
# fade-delta = 10
# no-fading-openclose = false


#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 1; # Opacity of window titlebars and borders.

# inactive-dim-fixed = false

#################################
#           Corners             #
#################################

corner-radius = 10


#################################
#            Blur               #
#################################

# Parameters for background blurring, see BLUR section in the man page for more information.
blur-method = "dual_kawase"
# blur-size = 12
# blur-deviation = false
blur-strength = 1


#################################
#       General Settings        #
#################################


backend = "glx" # Specify the backend to use: `xrender`, `glx`, or `egl`.

vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;


rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
}, {
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop' || "
           # With this I achieve that maximized windows do not have rounded corners. For some reason when they're maximized they have this parameter = 0
          "_NET_FRAME_EXTENTS@[*] = 0 || "
          "QTILE_INTERNAL = 1";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
},

# I took these animations from https://github.com/gh0stzk and slightly modified them.
# Animations for NORMAL windows.
{
  match = "window_type = 'normal'";
  animations = (
    {
        triggers = ["close"];
        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.15;
            start = "window-raw-opacity-before";
            end = 0;
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
            curve = "cubic-bezier(0,1.3,1,1)";
            duration = 0.15;
            start = 1;
            end = 0.6;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },

    # Animación de APERTURA
    {
        triggers = ["open"];
        opacity = {
            curve = "cubic-bezier(0,1,1,1)";
            duration = 0.15;
            start = 0;
            end = "window-raw-opacity";
        };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";

        scale-x = {
            curve = "cubic-bezier(0,1.3,1,1)";
            duration = 0.15;
            start = 0.6;
            end = 1;
        };
        scale-y = "scale-x";

        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";

        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    },

    # Animación de GEOMETRÍA (modificada para ambos casos)
    {
        triggers = ["geometry"];
        # Cuando la ventana CRECE (abrir/mover/redimensionar)
        scale-x = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.25;
            start = "window-width-before / window-width";
            end = 1;
        };

        # Cuando la ventana ENCOGE (cerrar/mover/redimensionar)
        scale-x-reverse = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.15;
            start = "window-width / window-width-before";
            end = 1;
        };
        scale-y = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.25;
            start = "window-height-before / window-height";
            end = 1;
        };
        scale-y-reverse = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.15;
            start = "window-height / window-height-before";
            end = 1;
        };
        offset-x = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.25;
            start = "window-x-before - window-x";
            end = 0;
        };
        offset-y = {
            curve = "cubic-bezier(0,0,0,1.28)";
            duration = 0.25;
            start = "window-y-before - window-y";
            end = 0;
        };
        shadow-scale-x = "scale-x";
        shadow-scale-y = "scale-y";
        shadow-offset-x = "offset-x";
        shadow-offset-y = "offset-y";
    }
  )
  },

# Animations for Rofi launchers.
{
  match = "class_g = 'Rofi'";
  animations = (
  {
    triggers = ["close", "hide"];
    preset = "disappear";
    duration = 0.05;
    scale = 0.5;
  },
  {
    triggers = ["open", "show"];
    preset = "appear";
    duration = 0.1;
    scale = 0.5;
  }
  )
})
