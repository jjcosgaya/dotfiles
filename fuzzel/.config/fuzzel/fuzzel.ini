# fuzzel — Kanagawa Dragon (Gogh)
# Same palette as waybar/gtk:
#   background #181616   (black)
#   foreground #c5c9c5   (white)
#   muted      #a6a69c   (gray)
#
# Layout: a wide, borderless pill at the top of the screen, just under
# the waybar. Single command-bar feel: the input row carries both the
# placeholder and the keybinding hints (↵ abrir / esc cerrar), and the
# list below uses a barely-there 1-step row highlight instead of a
# solid white chip — minimal, no decoration, no icons in the list.

[main]
# Font order matters for the icon: NSS2 before FA7 so U+1F50D renders
# as a thin line-stroke glyph, not a heavy solid one.
font=Source Sans 3:size=10, Noto Sans Symbols 2:size=10, Font Awesome 7 Free:size=10
use-bold=yes
dpi-aware=auto

prompt="🔍  "
# Placeholder stays minimal — just the cue, no crammed keybinding hints.
# (fuzzel 1.14 does not implement `mesg=` despite what the man page
# claims, so the keybinding hints cannot be put on a separate row.)
placeholder=Search…

icon-theme=FairyWren
icons-enabled=yes
fields=filename,name,generic,exec,keywords,comment
match-mode=fzf
sort-result=yes
match-counter=yes

terminal=wezterm start -- {cmd}

# Pill layout, just under the waybar (30px bar + 2px border + 2px air).
anchor=top
y-margin=34
x-margin=0
width=72
lines=5
horizontal-pad=20
vertical-pad=8
inner-pad=10
image-size-ratio=1

scaling-filter=lanczos3

[colors]
# Window is a single dark fill, no visible border — the pill shape is
# conveyed by the rounded corners and the contrast against the rest
# of the screen.
background=181616ff
border=00000000

# Unselected entries in muted gray; typed matches pop in white.
text=a6a69cff
match=ffffffff

# Prompt, input and placeholder: white ramp (placeholder is dimmer
# because the trailing "↵ abrir / esc cerrar" hints are decoration).
prompt=ffffffff
input=ffffffff
placeholder=6b6b6bff
message=a6a69cff

# Match counter on the right of the input.
counter=5c5c5cff

# Selection = a 1-step lift (Kanagawa bg_p1 #1f1d1e), not a chip. The
# text goes pure white + bold; the matched substring is also white
# (no need for a different color when the row stays dark).
selection=1f1d1eff
selection-text=ffffffff
selection-match=ffffffff

[border]
# No outer border — the rounded shape is enough.
width=0
radius=6
selection-radius=4
