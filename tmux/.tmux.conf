# tmux config (tmux 3.7b). Reload with: tmux source-file ~/.tmux.conf

# ──── Prefix ──────────────────────────────────────────────────────
# Ctrl-t instead of the default Ctrl-b
unbind C-b
set -g prefix C-t

# ──── Status bar ──────────────────────────────────────────────────
# Move status bar to top
set -g status-position top

# Minimalistic styling
set -g status-style "bg=default,fg=default"

set -g status-left "#[fg=color15] #S #[fg=color2]| "
set -g status-right "#{pomodoro_status}"

# Tab icon alternatives (inactive / active): terminals  / , circles ○ / ●
set -g window-status-format "#[fg=color7]◌ #I:#W"
set -g window-status-current-format "#[fg=color3,bold]◉ #I:#W"

set -g status-justify left
set -g status-right-length 20
set -g status-left-length 20

# ──── Windows & panes ─────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ──── Keys ────────────────────────────────────────────────────────
# Extended keys: Shift+Enter, Ctrl+Enter, ...
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi keys in copy mode
set -g mode-keys vi

# Pane navigation: prefix + h/j/k/l, or Alt+h/j/k/l
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Swap panes up/down: prefix + J/K
bind-key 'K' swap-pane -U
bind-key 'J' swap-pane -D

# Resize panes: prefix + Ctrl+h/j/k/l (repeatable)
bind-key -r C-h resize-pane -L 4
bind-key -r C-j resize-pane -D 4
bind-key -r C-k resize-pane -U 4
bind-key -r C-l resize-pane -R 4

# Split / new window in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Cycle windows: Alt+n/p
bind -n M-n next-window
bind -n M-p previous-window

# Move window left/right: prefix + N/P
bind-key 'P' swap-window -t -1\; select-window -t -1
bind-key 'N' swap-window -t +1\; select-window -t +1

# ──── Clipboard ───────────────────────────────────────────────────
# Copy in copy mode to the Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
# Prefix + y enters copy mode
bind-key y copy-mode

# ──── Plugins ─────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

# ──── Pomodoro Plus ───────────────────────────────────────────────
set -g @pomodoro_toggle 'p'
set -g @pomodoro_cancel Escape
set -g @pomodoro_skip '_'

set -g @pomodoro_mins 50
set -g @pomodoro_break_mins 20
set -g @pomodoro_intervals 2
set -g @pomodoro_long_break_mins 20

set -g @pomodoro_on " 🍅 "
set -g @pomodoro_complete " ✔︎ "
set -g @pomodoro_pause " ⏸︎ "
set -g @pomodoro_prompt_break " ⏲︎ break? "
set -g @pomodoro_prompt_pomodoro " ⏱︎ start? "

set -g @pomodoro_notifications 'on'

# ──── TPM init ────────────────────────────────────────────────────
# Keep this line at the very bottom of the config
run '~/.tmux/plugins/tpm/tpm'
